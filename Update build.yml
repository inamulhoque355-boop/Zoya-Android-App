name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        unzip zoya-ai-companion-project.zip -d extracted_project

    - name: Build APK with Gradle
      run: |
        cd extracted_project/zoya-ai-companion-project
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
