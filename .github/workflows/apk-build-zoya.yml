name: Build Zoya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Zoya Project ZIP
        run: |
          set -e

          mkdir -p extracted_project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Zoya ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted_project

      - name: Check Zoya Project
        run: |
          set -e

          test -f extracted_project/package.json
          test -d extracted_project/android

          echo "Zoya project found."
          echo "Android project found."

      - name: Install Node Dependencies
        working-directory: ./extracted_project
        run: npm install

      - name: Build Zoya Web App
        working-directory: ./extracted_project
        run: npm run build

      - name: Copy Web Files to Android Assets
        working-directory: ./extracted_project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          
      - name: Build Debug APK
        working-directory: ./extracted_project/android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          set -e

          APK=$(find extracted_project/android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zoya-APK
          path: ${{ env.APK_PATH }}
